global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Raspberry Pi Host Hardware & OS Metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: "raspberrypi-5"
          device: "host"

  # Docker Container Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "raspberrypi-docker"

  # Blackbox HTTP / Service Probing
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://prometheus:9090/-/healthy"
          - "http://alertmanager:9093/-/healthy"
          - "http://grafana:3000/api/health"
          - "http://cadvisor:8080/healthz"
          - "http://host.docker.internal:3000"       # Gitea (if running)
          - "http://host.docker.internal:5000/v2/"    # Docker Registry (if running)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox:9115"
